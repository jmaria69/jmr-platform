<svg width="32" height="32" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="go" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="fc"><feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#22d3ee" flood-opacity="1"/></filter>
    <filter id="fp"><feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#f472b6" flood-opacity="1"/></filter>
    <filter id="fv"><feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#a78bfa" flood-opacity="1"/></filter>
    <filter id="core"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#a78bfa" flood-opacity="0.9"/></filter>
  </defs>
  <!-- Orbit rings -->
  <ellipse cx="36" cy="36" rx="34" ry="11" stroke="url(#go)" stroke-width="1.5" fill="none" opacity="0.5"/>
  <ellipse cx="36" cy="36" rx="34" ry="11" stroke="url(#go)" stroke-width="1.5" fill="none" opacity="0.5" transform="rotate(60 36 36)"/>
  <ellipse cx="36" cy="36" rx="34" ry="11" stroke="url(#go)" stroke-width="1.5" fill="none" opacity="0.5" transform="rotate(120 36 36)"/>
  <!-- Nucleus -->
  <circle cx="36" cy="36" r="5.5" fill="url(#go)" filter="url(#core)"/>
  <circle cx="36" cy="36" r="2.5" fill="white" opacity="0.95"/>
  <!-- Electron — orbit 1 (cyan, right) -->
  <circle cx="70" cy="36" r="3.8" fill="#22d3ee" filter="url(#fc)"/>
  <!-- Electron — orbit 2 (pink, top-left) -->
  <circle cx="17" cy="9" r="3.8" fill="#f472b6" filter="url(#fp)"/>
  <!-- Electron — orbit 3 (violet, bottom-left) -->
  <circle cx="17" cy="63" r="3.8" fill="#a78bfa" filter="url(#fv)"/>
</svg>
