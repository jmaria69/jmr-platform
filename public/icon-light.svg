<svg width="32" height="32" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg>
  <defs>
    <linearGradient id="gol" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9d4edd"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>
  <!-- Orbit rings -->
  <ellipse cx="36" cy="36" rx="34" ry="11" stroke="url(#gol)" stroke-width="2.4" fill="none" opacity="0.9"/>
  <ellipse cx="36" cy="36" rx="34" ry="11" stroke="url(#gol)" stroke-width="2.4" fill="none" opacity="0.9" transform="rotate(60 36 36)"/>
  <ellipse cx="36" cy="36" rx="34" ry="11" stroke="url(#gol)" stroke-width="2.4" fill="none" opacity="0.9" transform="rotate(120 36 36)"/>
  <!-- Nucleus -->
  <circle cx="36" cy="36" r="6.5" fill="url(#gol)"/>
  <circle cx="36" cy="36" r="2.8" fill="#3f0071"/>
  <!-- Electron — orbit 1 (cyan, right) -->
  <circle cx="70" cy="36" r="4.2" fill="#0369a1"/>
  <!-- Electron — orbit 2 (pink, top-left) -->
  <circle cx="17" cy="9" r="4.2" fill="#9d4edd"/>
  <!-- Electron — orbit 3 (violet, bottom-left) -->
  <circle cx="17" cy="63" r="4.2" fill="#7c3aed"/>
</svg>