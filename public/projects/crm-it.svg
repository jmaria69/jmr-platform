<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-core" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#062226"/>
      <stop offset="100%" stop-color="#080f14"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-teal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-core)"/>
  <ellipse cx="400" cy="225" rx="280" ry="180" fill="url(#glow-cyan)"/>
  <ellipse cx="620" cy="100" rx="160" ry="120" fill="url(#glow-teal)"/>

  <g stroke="#06b6d4" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Network node graph -->
  <circle cx="400" cy="215" r="120" fill="none" stroke="#06b6d4" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="400" cy="215" r="145" fill="none" stroke="#06b6d4" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="8 4"/>

  <g stroke="#06b6d4" stroke-opacity="0.35" stroke-width="1.2">
    <line x1="400" y1="215" x2="345" y2="165"/>
    <line x1="400" y1="215" x2="455" y2="165"/>
    <line x1="400" y1="215" x2="345" y2="265"/>
    <line x1="400" y1="215" x2="455" y2="265"/>
    <line x1="345" y1="165" x2="345" y2="265"/>
    <line x1="455" y1="165" x2="455" y2="265"/>
  </g>
  <circle cx="400" cy="215" r="16" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1.5"/>
  <circle cx="345" cy="165" r="8" fill="#0d0d1f" stroke="#06b6d4" stroke-width="1.5"/>
  <circle cx="455" cy="165" r="8" fill="#0d0d1f" stroke="#06b6d4" stroke-width="1.5"/>
  <circle cx="345" cy="265" r="8" fill="#0d0d1f" stroke="#06b6d4" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="455" cy="265" r="8" fill="#0d0d1f" stroke="#06b6d4" stroke-width="1.5"/>

  <circle cx="280" cy="185" r="5" fill="#14b8a6" fill-opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="505" cy="270" r="4" fill="#22d3ee" fill-opacity="0.8">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Network monitor log panel -->
  <g transform="translate(560, 130)">
    <rect x="0" y="0" width="175" height="145" rx="8" fill="#0d0d1f" fill-opacity="0.9" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="1"/>
    <rect x="0" y="0" width="175" height="28" rx="8" fill="#06b6d4" fill-opacity="0.12"/>
    <circle cx="14" cy="14" r="5" fill="#06b6d4" fill-opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="25" y="18" font-family="monospace" font-size="9" fill="#22d3ee" font-weight="bold">NETWORK MONITOR</text>

    <rect x="8" y="36" width="6" height="6" rx="1" fill="#06b6d4"/>
    <text x="20" y="44" font-family="monospace" font-size="7.5" fill="#9ca3af">Sync ERP · OK</text>

    <rect x="8" y="52" width="6" height="6" rx="1" fill="#14b8a6"/>
    <text x="20" y="60" font-family="monospace" font-size="7.5" fill="#9ca3af">Backup completado</text>

    <rect x="8" y="68" width="6" height="6" rx="1" fill="#f59e0b"/>
    <text x="20" y="76" font-family="monospace" font-size="7.5" fill="#9ca3af">Alerta CPU 82%</text>

    <rect x="8" y="84" width="6" height="6" rx="1" fill="#06b6d4"/>
    <text x="20" y="92" font-family="monospace" font-size="7.5" fill="#9ca3af">Deploy nginx OK</text>

    <rect x="8" y="100" width="6" height="6" rx="1" fill="#22d3ee"/>
    <text x="20" y="108" font-family="monospace" font-size="7.5" fill="#6b7280">VERA: análisis listo</text>

    <rect x="8" y="122" width="4" height="8" fill="#06b6d4" fill-opacity="0.8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="18" y="130" font-family="monospace" font-size="7" fill="#4b5563">Monitorizando...</text>
  </g>

  <!-- Stat pills -->
  <g transform="translate(60, 155)">
    <rect x="0" y="0" width="130" height="52" rx="10" fill="#0d0d1f" fill-opacity="0.9" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="8" fill="#6b7280" font-weight="bold" letter-spacing="1">UPTIME</text>
    <text x="12" y="40" font-family="sans-serif" font-size="20" fill="#22d3ee" font-weight="bold">99.9%</text>
  </g>

  <g transform="translate(60, 220)">
    <rect x="0" y="0" width="130" height="52" rx="10" fill="#0d0d1f" fill-opacity="0.9" stroke="#14b8a6" stroke-opacity="0.2" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="8" fill="#6b7280" font-weight="bold" letter-spacing="1">MÓDULOS</text>
    <text x="12" y="40" font-family="sans-serif" font-size="20" fill="#2dd4bf" font-weight="bold">ERP+RED</text>
  </g>

  <text x="400" y="340" font-family="sans-serif" font-size="26" font-weight="900" fill="white" text-anchor="middle" letter-spacing="4">CORE OPS</text>
  <text x="400" y="362" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">CENTRO DE MANDO IT ENTERPRISE</text>

  <rect x="330" y="374" width="140" height="22" rx="11" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1"/>
  <text x="400" y="388" font-family="sans-serif" font-size="9" fill="#22d3ee" text-anchor="middle" font-weight="bold" letter-spacing="2">AUTOPILOT · LIVE</text>
</svg>
