<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-olga" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0f2b"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <radialGradient id="glow-violet2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-olga)"/>
  <ellipse cx="400" cy="225" rx="280" ry="180" fill="url(#glow-violet2)"/>
  <ellipse cx="620" cy="110" rx="160" ry="120" fill="url(#glow-pink)"/>

  <g stroke="#8b5cf6" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Central controller + orbiting agents (Cleo, Miguel, Valentina) -->
  <circle cx="400" cy="215" r="120" fill="none" stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="400" cy="215" r="145" fill="none" stroke="#8b5cf6" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="8 4"/>

  <circle cx="400" cy="215" r="34" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.8"/>
  <circle cx="400" cy="215" r="20" fill="#8b5cf6" fill-opacity="0.15"/>
  <text x="400" y="220" font-family="sans-serif" font-size="11" fill="#c4b5fd" text-anchor="middle" font-weight="bold">OLGA</text>

  <g stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1">
    <line x1="400" y1="215" x2="310" y2="165"/>
    <line x1="400" y1="215" x2="490" y2="165"/>
    <line x1="400" y1="215" x2="400" y2="290"/>
  </g>
  <circle cx="310" cy="165" r="9" fill="#0d0d1f" stroke="#8b5cf6" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="310" y="152" font-family="monospace" font-size="7" fill="#a78bfa" text-anchor="middle">CLEO</text>

  <circle cx="490" cy="165" r="9" fill="#0d0d1f" stroke="#ec4899" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="490" y="152" font-family="monospace" font-size="7" fill="#f0abfc" text-anchor="middle">MIGUEL</text>

  <circle cx="400" cy="290" r="9" fill="#0d0d1f" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="400" y="311" font-family="monospace" font-size="7" fill="#a78bfa" text-anchor="middle">VALENTINA</text>

  <!-- Agent log panel -->
  <g transform="translate(560, 130)">
    <rect x="0" y="0" width="175" height="145" rx="8" fill="#0d0d1f" fill-opacity="0.9" stroke="#8b5cf6" stroke-opacity="0.2" stroke-width="1"/>
    <rect x="0" y="0" width="175" height="28" rx="8" fill="#8b5cf6" fill-opacity="0.12"/>
    <circle cx="14" cy="14" r="5" fill="#8b5cf6" fill-opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="25" y="18" font-family="monospace" font-size="9" fill="#c4b5fd" font-weight="bold">AGENT LOG</text>

    <rect x="8" y="36" width="6" height="6" rx="1" fill="#8b5cf6"/>
    <text x="20" y="44" font-family="monospace" font-size="7.5" fill="#9ca3af">Telegram: comando OK</text>

    <rect x="8" y="52" width="6" height="6" rx="1" fill="#ec4899"/>
    <text x="20" y="60" font-family="monospace" font-size="7.5" fill="#9ca3af">Podcast renderizado</text>

    <rect x="8" y="68" width="6" height="6" rx="1" fill="#8b5cf6"/>
    <text x="20" y="76" font-family="monospace" font-size="7.5" fill="#9ca3af">Sync GSheet/Amazon</text>

    <rect x="8" y="84" width="6" height="6" rx="1" fill="#a78bfa"/>
    <text x="20" y="92" font-family="monospace" font-size="7.5" fill="#9ca3af">Auditoría viral OK</text>

    <rect x="8" y="100" width="6" height="6" rx="1" fill="#f0abfc"/>
    <text x="20" y="108" font-family="monospace" font-size="7.5" fill="#6b7280">Docker: 6 activos</text>

    <rect x="8" y="122" width="4" height="8" fill="#8b5cf6" fill-opacity="0.8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="18" y="130" font-family="monospace" font-size="7" fill="#4b5563">Orquestando...</text>
  </g>

  <!-- Stat pills -->
  <g transform="translate(60, 155)">
    <rect x="0" y="0" width="130" height="52" rx="10" fill="#0d0d1f" fill-opacity="0.9" stroke="#8b5cf6" stroke-opacity="0.2" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="8" fill="#6b7280" font-weight="bold" letter-spacing="1">AGENTES</text>
    <text x="12" y="40" font-family="sans-serif" font-size="20" fill="#c4b5fd" font-weight="bold">4 ACTIVOS</text>
  </g>

  <g transform="translate(60, 220)">
    <rect x="0" y="0" width="130" height="52" rx="10" fill="#0d0d1f" fill-opacity="0.9" stroke="#ec4899" stroke-opacity="0.2" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="8" fill="#6b7280" font-weight="bold" letter-spacing="1">CANAL</text>
    <text x="12" y="40" font-family="sans-serif" font-size="20" fill="#f0abfc" font-weight="bold">TELEGRAM</text>
  </g>

  <text x="400" y="352" font-family="sans-serif" font-size="26" font-weight="900" fill="white" text-anchor="middle" letter-spacing="4">OLGA.AI</text>
  <text x="400" y="374" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="1.5">OPERATIVE LOGISTICS &amp; GENERAL ASSISTANT</text>

  <rect x="320" y="386" width="160" height="20" rx="10" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
  <text x="400" y="399" font-family="sans-serif" font-size="8.5" fill="#c4b5fd" text-anchor="middle" font-weight="bold" letter-spacing="1.5">MULTI-AGENTE · DOCKER</text>
</svg>
