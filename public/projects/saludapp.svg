<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-salud" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#041a1f"/>
      <stop offset="100%" stop-color="#040d10"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-salud)"/>

  <!-- Ambient glows -->
  <ellipse cx="380" cy="220" rx="260" ry="180" fill="url(#glow-cyan)"/>
  <ellipse cx="600" cy="120" rx="180" ry="140" fill="url(#glow-green)"/>

  <!-- Subtle grid -->
  <g stroke="#06b6d4" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- ECG / heartbeat line -->
  <polyline
    points="50,220 150,220 180,220 195,170 210,260 225,190 240,245 255,220 360,220 380,220 395,155 410,275 425,180 440,250 455,220 750,220"
    fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dasharray" values="0,1200;1200,0" dur="3s" repeatCount="indefinite"/>
  </polyline>

  <!-- Outer orbit ring -->
  <circle cx="400" cy="220" r="140" fill="none" stroke="#06b6d4" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="6 4"/>
  <circle cx="400" cy="220" r="115" fill="none" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Main cross / medical icon -->
  <rect x="375" y="155" width="50" height="130" rx="12" fill="#06b6d4" fill-opacity="0.08" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="340" y="195" width="120" height="50" rx="12" fill="#06b6d4" fill-opacity="0.08" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Cross inner fill -->
  <rect x="382" y="162" width="36" height="116" rx="8" fill="#06b6d4" fill-opacity="0.05"/>
  <rect x="346" y="202" width="108" height="36" rx="8" fill="#06b6d4" fill-opacity="0.05"/>

  <!-- Heart inside cross center -->
  <path d="M400 228 C400 228 386 216 386 208 C386 203 390 199 395 199 C397.5 199 400 201.5 400 201.5 C400 201.5 402.5 199 405 199 C410 199 414 203 414 208 C414 216 400 228 400 228 Z"
    fill="#06b6d4" fill-opacity="0.8">
    <animate attributeName="fill-opacity" values="0.8;0.4;0.8" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- Pulse ring -->
  <circle cx="400" cy="220" r="80" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5">
    <animate attributeName="r" values="80;100;80" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Orbiting data nodes -->
  <circle cx="280" cy="160" r="5" fill="#10b981" fill-opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <line x1="280" y1="160" x2="335" y2="190" stroke="#10b981" stroke-opacity="0.2" stroke-width="1"/>

  <circle cx="515" cy="155" r="4" fill="#06b6d4" fill-opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <line x1="515" y1="155" x2="462" y2="180" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="1"/>

  <circle cx="520" cy="285" r="4" fill="#10b981" fill-opacity="0.8">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <line x1="520" y1="285" x2="465" y2="258" stroke="#10b981" stroke-opacity="0.2" stroke-width="1"/>

  <circle cx="280" cy="282" r="3" fill="#0891b2" fill-opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Appointment panel (right side) -->
  <g transform="translate(558, 130)">
    <rect x="0" y="0" width="190" height="160" rx="10" fill="#041a1f" fill-opacity="0.95" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="1"/>
    <!-- Header -->
    <rect x="0" y="0" width="190" height="30" rx="10" fill="#06b6d4" fill-opacity="0.1"/>
    <circle cx="16" cy="15" r="5" fill="#10b981" fill-opacity="0.9"/>
    <text x="28" y="19" font-family="sans-serif" font-size="9" fill="#06b6d4" font-weight="bold">AGENDA HOY</text>
    <text x="150" y="19" font-family="monospace" font-size="8" fill="#4b5563">✓ sync</text>

    <!-- Appointments -->
    <rect x="10" y="38" width="3" height="22" rx="1.5" fill="#10b981"/>
    <text x="20" y="48" font-family="sans-serif" font-size="9" fill="#d1d5db" font-weight="600">09:00 · García, M.</text>
    <text x="20" y="58" font-family="sans-serif" font-size="8" fill="#6b7280">Revisión general · Confirmada</text>

    <rect x="10" y="68" width="3" height="22" rx="1.5" fill="#06b6d4"/>
    <text x="20" y="78" font-family="sans-serif" font-size="9" fill="#d1d5db" font-weight="600">10:30 · López, A.</text>
    <text x="20" y="88" font-family="sans-serif" font-size="8" fill="#6b7280">Seguimiento · Confirmada</text>

    <rect x="10" y="98" width="3" height="22" rx="1.5" fill="#0891b2" fill-opacity="0.6"/>
    <text x="20" y="108" font-family="sans-serif" font-size="9" fill="#9ca3af">12:00 · Martín, R.</text>
    <text x="20" y="118" font-family="sans-serif" font-size="8" fill="#6b7280">Pendiente recordatorio</text>

    <!-- Recordatorio automático -->
    <rect x="8" y="130" width="174" height="20" rx="5" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.2" stroke-width="1"/>
    <text x="16" y="143" font-family="sans-serif" font-size="8" fill="#10b981">⚡ SMS automático enviado · hace 2 min</text>
  </g>

  <!-- Stats left -->
  <g transform="translate(60, 148)">
    <rect x="0" y="0" width="135" height="52" rx="10" fill="#041a1f" fill-opacity="0.95" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="8" fill="#6b7280" font-weight="bold" letter-spacing="1">TIEMPO RESP.</text>
    <text x="12" y="40" font-family="sans-serif" font-size="20" fill="#06b6d4" font-weight="bold">18 min</text>
  </g>

  <g transform="translate(60, 213)">
    <rect x="0" y="0" width="135" height="52" rx="10" fill="#041a1f" fill-opacity="0.95" stroke="#10b981" stroke-opacity="0.2" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="8" fill="#6b7280" font-weight="bold" letter-spacing="1">AUTOMATIZADO</text>
    <text x="12" y="40" font-family="sans-serif" font-size="20" fill="#10b981" font-weight="bold">94%</text>
  </g>

  <!-- Label -->
  <text x="400" y="338" font-family="sans-serif" font-size="26" font-weight="900" fill="white" text-anchor="middle" letter-spacing="3">SaludApp</text>
  <text x="400" y="360" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">GESTIÓN SANITARIA CON INTELIGENCIA ARTIFICIAL</text>

  <!-- Beta badge -->
  <rect x="338" y="372" width="124" height="22" rx="11" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="1"/>
  <text x="400" y="386" font-family="sans-serif" font-size="9" fill="#06b6d4" text-anchor="middle" font-weight="bold" letter-spacing="2">BETA · AI-POWERED</text>
</svg>
