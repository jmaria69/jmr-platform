<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-siam" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0a0a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <radialGradient id="glow-red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-orange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-siam)"/>

  <!-- Ambient glows -->
  <ellipse cx="400" cy="225" rx="280" ry="180" fill="url(#glow-red)"/>
  <ellipse cx="620" cy="100" rx="160" ry="120" fill="url(#glow-orange)"/>

  <!-- Grid lines (cyber aesthetic) -->
  <g stroke="#dc2626" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Shield outer ring -->
  <circle cx="400" cy="225" r="145" fill="none" stroke="#dc2626" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="8 4"/>
  <circle cx="400" cy="225" r="120" fill="none" stroke="#dc2626" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Shield shape -->
  <path d="M400 105 L480 140 L480 210 Q480 270 400 305 Q320 270 320 210 L320 140 Z"
    fill="#dc2626" fill-opacity="0.08"
    stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Shield inner glow -->
  <path d="M400 120 L468 151 L468 208 Q468 260 400 292 Q332 260 332 208 L332 151 Z"
    fill="#dc2626" fill-opacity="0.05"/>

  <!-- Lock icon inside shield -->
  <rect x="382" y="205" width="36" height="28" rx="4" fill="none" stroke="#dc2626" stroke-width="2" stroke-opacity="0.8"/>
  <path d="M388 205 L388 198 Q388 188 400 188 Q412 188 412 198 L412 205"
    fill="none" stroke="#dc2626" stroke-width="2" stroke-opacity="0.8"/>
  <circle cx="400" cy="219" r="4" fill="#dc2626" fill-opacity="0.9"/>
  <line x1="400" y1="222" x2="400" y2="228" stroke="#dc2626" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Orbiting threat indicators -->
  <!-- Orbit 1 -->
  <circle cx="280" cy="185" r="5" fill="#f97316" fill-opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <line x1="280" y1="185" x2="340" y2="195" stroke="#f97316" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Orbit 2 -->
  <circle cx="510" cy="160" r="4" fill="#dc2626" fill-opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <line x1="510" y1="160" x2="462" y2="178" stroke="#dc2626" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Orbit 3 -->
  <circle cx="505" cy="270" r="4" fill="#ef4444" fill-opacity="0.8">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <line x1="505" y1="270" x2="462" y2="255" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Orbit 4 -->
  <circle cx="285" cy="270" r="3" fill="#fbbf24" fill-opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.1s" repeatCount="indefinite"/>
  </circle>

  <!-- Alert pulses around shield -->
  <circle cx="400" cy="225" r="85" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.6">
    <animate attributeName="r" values="85;105;85" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Event log lines (right side) -->
  <g transform="translate(560, 145)">
    <rect x="0" y="0" width="175" height="130" rx="8" fill="#0d0d1f" fill-opacity="0.9" stroke="#dc2626" stroke-opacity="0.2" stroke-width="1"/>
    <!-- Header -->
    <rect x="0" y="0" width="175" height="28" rx="8" fill="#dc2626" fill-opacity="0.12"/>
    <circle cx="14" cy="14" r="5" fill="#dc2626" fill-opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="25" y="18" font-family="monospace" font-size="9" fill="#dc2626" font-weight="bold">THREAT MONITOR</text>

    <!-- Log entries -->
    <rect x="8" y="36" width="6" height="6" rx="1" fill="#ef4444"/>
    <text x="20" y="44" font-family="monospace" font-size="7.5" fill="#9ca3af">Brute force · 23:41:02</text>

    <rect x="8" y="52" width="6" height="6" rx="1" fill="#f97316"/>
    <text x="20" y="60" font-family="monospace" font-size="7.5" fill="#9ca3af">Port scan · 23:41:08</text>

    <rect x="8" y="68" width="6" height="6" rx="1" fill="#dc2626"/>
    <text x="20" y="76" font-family="monospace" font-size="7.5" fill="#9ca3af">Token invalid · 23:41:15</text>

    <rect x="8" y="84" width="6" height="6" rx="1" fill="#fbbf24"/>
    <text x="20" y="92" font-family="monospace" font-size="7.5" fill="#9ca3af">Rate limit · 23:41:19</text>

    <rect x="8" y="100" width="6" height="6" rx="1" fill="#ef4444"/>
    <text x="20" y="108" font-family="monospace" font-size="7.5" fill="#6b7280">SQL inject · 23:41:24</text>

    <!-- blinking cursor -->
    <rect x="8" y="118" width="4" height="8" fill="#dc2626" fill-opacity="0.8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="18" y="126" font-family="monospace" font-size="7" fill="#4b5563">Analyzing...</text>
  </g>

  <!-- Stat pill left -->
  <g transform="translate(60, 155)">
    <rect x="0" y="0" width="130" height="52" rx="10" fill="#0d0d1f" fill-opacity="0.9" stroke="#dc2626" stroke-opacity="0.2" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="8" fill="#6b7280" font-weight="bold" letter-spacing="1">DETECTION</text>
    <text x="12" y="40" font-family="sans-serif" font-size="20" fill="#dc2626" font-weight="bold">&lt;3 min</text>
  </g>

  <!-- Stat pill left 2 -->
  <g transform="translate(60, 220)">
    <rect x="0" y="0" width="130" height="52" rx="10" fill="#0d0d1f" fill-opacity="0.9" stroke="#f97316" stroke-opacity="0.2" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="8" fill="#6b7280" font-weight="bold" letter-spacing="1">ACCURACY</text>
    <text x="12" y="40" font-family="sans-serif" font-size="20" fill="#f97316" font-weight="bold">99.8%</text>
  </g>

  <!-- Labels -->
  <text x="400" y="340" font-family="sans-serif" font-size="26" font-weight="900" fill="white" text-anchor="middle" letter-spacing="4">SIAM</text>
  <text x="400" y="362" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">SECURITY INTELLIGENCE &amp; ALERT MONITOR</text>

  <!-- Beta badge -->
  <rect x="342" y="374" width="116" height="22" rx="11" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-opacity="0.4" stroke-width="1"/>
  <text x="400" y="388" font-family="sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="bold" letter-spacing="2">BETA · AI-POWERED</text>
</svg>
