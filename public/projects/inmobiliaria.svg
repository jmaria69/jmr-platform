<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-inmo" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#062017"/>
      <stop offset="100%" stop-color="#080f0d"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-amber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-inmo)"/>
  <ellipse cx="400" cy="225" rx="280" ry="180" fill="url(#glow-green)"/>
  <ellipse cx="620" cy="110" rx="160" ry="120" fill="url(#glow-amber)"/>

  <g stroke="#10b981" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- House icon -->
  <circle cx="400" cy="215" r="120" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="400" cy="215" r="145" fill="none" stroke="#10b981" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="8 4"/>

  <path d="M400 130 L475 190 L455 190 L455 275 L345 275 L345 190 L325 190 Z"
    fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.7"/>
  <rect x="378" y="220" width="44" height="55" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
  <rect x="358" y="205" width="22" height="22" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
  <rect x="420" y="205" width="22" height="22" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Map pin marker orbiting -->
  <g transform="translate(280, 175)">
    <path d="M0 0 C-8 0 -14 6 -14 14 C-14 24 0 38 0 38 C0 38 14 24 14 14 C14 6 8 0 0 0 Z" fill="#f59e0b" fill-opacity="0.85"/>
    <circle cx="0" cy="13" r="4.5" fill="#0d0d1f"/>
    <animateTransform attributeName="transform" type="translate" values="280,175;280,168;280,175" dur="2.4s" repeatCount="indefinite" additive="sum"/>
  </g>

  <circle cx="510" cy="270" r="4" fill="#34d399" fill-opacity="0.8">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Lead engine log panel -->
  <g transform="translate(560, 130)">
    <rect x="0" y="0" width="175" height="145" rx="8" fill="#0d0d1f" fill-opacity="0.9" stroke="#10b981" stroke-opacity="0.2" stroke-width="1"/>
    <rect x="0" y="0" width="175" height="28" rx="8" fill="#10b981" fill-opacity="0.12"/>
    <circle cx="14" cy="14" r="5" fill="#10b981" fill-opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="25" y="18" font-family="monospace" font-size="9" fill="#34d399" font-weight="bold">LEAD ENGINE</text>

    <rect x="8" y="36" width="6" height="6" rx="1" fill="#10b981"/>
    <text x="20" y="44" font-family="monospace" font-size="7.5" fill="#9ca3af">Lead cualificado</text>

    <rect x="8" y="52" width="6" height="6" rx="1" fill="#f59e0b"/>
    <text x="20" y="60" font-family="monospace" font-size="7.5" fill="#9ca3af">Tour inmersivo listo</text>

    <rect x="8" y="68" width="6" height="6" rx="1" fill="#10b981"/>
    <text x="20" y="76" font-family="monospace" font-size="7.5" fill="#9ca3af">Hipoteca calculada</text>

    <rect x="8" y="84" width="6" height="6" rx="1" fill="#34d399"/>
    <text x="20" y="92" font-family="monospace" font-size="7.5" fill="#9ca3af">Agente contactado</text>

    <rect x="8" y="100" width="6" height="6" rx="1" fill="#fbbf24"/>
    <text x="20" y="108" font-family="monospace" font-size="7.5" fill="#6b7280">Filtro geo aplicado</text>

    <rect x="8" y="122" width="4" height="8" fill="#10b981" fill-opacity="0.8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="18" y="130" font-family="monospace" font-size="7" fill="#4b5563">Buscando...</text>
  </g>

  <!-- Stat pills -->
  <g transform="translate(60, 155)">
    <rect x="0" y="0" width="130" height="52" rx="10" fill="#0d0d1f" fill-opacity="0.9" stroke="#10b981" stroke-opacity="0.2" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="8" fill="#6b7280" font-weight="bold" letter-spacing="1">LEADS</text>
    <text x="12" y="40" font-family="sans-serif" font-size="20" fill="#34d399" font-weight="bold">AUTO</text>
  </g>

  <g transform="translate(60, 220)">
    <rect x="0" y="0" width="130" height="52" rx="10" fill="#0d0d1f" fill-opacity="0.9" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="8" fill="#6b7280" font-weight="bold" letter-spacing="1">TOURS</text>
    <text x="12" y="40" font-family="sans-serif" font-size="20" fill="#fbbf24" font-weight="bold">3D IA</text>
  </g>

  <text x="400" y="340" font-family="sans-serif" font-size="26" font-weight="900" fill="white" text-anchor="middle" letter-spacing="4">INMOTECH</text>
  <text x="400" y="362" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">PLATAFORMA INMOBILIARIA IA</text>

  <rect x="330" y="374" width="140" height="22" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
  <text x="400" y="388" font-family="sans-serif" font-size="9" fill="#34d399" text-anchor="middle" font-weight="bold" letter-spacing="2">CUALIFICACIÓN IA</text>
</svg>
