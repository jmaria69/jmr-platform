<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-mp" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#240a0a"/>
      <stop offset="100%" stop-color="#0f0a0a"/>
    </radialGradient>
    <radialGradient id="glow-red3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-amber4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-mp)"/>
  <ellipse cx="400" cy="225" rx="280" ry="180" fill="url(#glow-red3)"/>
  <ellipse cx="620" cy="110" rx="160" ry="120" fill="url(#glow-amber4)"/>

  <g stroke="#ef4444" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <circle cx="350" cy="215" r="120" fill="none" stroke="#ef4444" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="350" cy="215" r="145" fill="none" stroke="#ef4444" stroke-opacity="0.13" stroke-width="1" stroke-dasharray="8 4"/>

  <!-- Price tag -->
  <g transform="translate(320, 230)">
    <path d="M-10 -55 L35 -55 L60 -30 L15 25 L-35 -25 Z" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.6" stroke-opacity="0.85"/>
    <circle cx="12" cy="-38" r="6" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-opacity="0.85"/>
  </g>

  <!-- Magnifying glass over tag -->
  <g transform="translate(355, 245)">
    <circle cx="0" cy="0" r="26" fill="#0f0a0a" fill-opacity="0.3" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.85"/>
    <line x1="19" y1="19" x2="40" y2="40" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-opacity="0.85"/>
  </g>

  <!-- Price trend chart panel -->
  <g transform="translate(540, 130)">
    <rect x="0" y="0" width="200" height="150" rx="10" fill="#0f0a0a" fill-opacity="0.92" stroke="#ef4444" stroke-opacity="0.22" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="9" fill="#f87171" font-weight="bold" letter-spacing="1">HISTÓRICO PRECIOS</text>
    <polyline points="14,110 45,90 76,100 107,65 138,80 169,45 190,55" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0,400;400,0" dur="2.5s" repeatCount="indefinite"/>
    </polyline>
    <text x="12" y="132" font-family="sans-serif" font-size="8" fill="#9ca3af">3 fuentes comparadas</text>
    <text x="12" y="146" font-family="sans-serif" font-size="8" fill="#34d399">Bajada detectada: -12%</text>
  </g>

  <!-- Stat pill -->
  <g transform="translate(60, 165)">
    <rect x="0" y="0" width="140" height="52" rx="10" fill="#0f0a0a" fill-opacity="0.9" stroke="#ef4444" stroke-opacity="0.2" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="8" fill="#6b7280" font-weight="bold" letter-spacing="1">ALERTAS ML</text>
    <text x="12" y="40" font-family="sans-serif" font-size="18" fill="#f87171" font-weight="bold">TIEMPO REAL</text>
  </g>

  <text x="400" y="345" font-family="sans-serif" font-size="26" font-weight="900" fill="white" text-anchor="middle" letter-spacing="3">MEJORESPRODUCTOS</text>
  <text x="400" y="367" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">COMPARADOR INTELIGENTE DE PRECIOS</text>

  <rect x="330" y="379" width="140" height="22" rx="11" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>
  <text x="400" y="393" font-family="sans-serif" font-size="9" fill="#f87171" text-anchor="middle" font-weight="bold" letter-spacing="2">BETA · SCRAPING + ML</text>
</svg>
