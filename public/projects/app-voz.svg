<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-voz" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#221505"/>
      <stop offset="100%" stop-color="#0f0b06"/>
    </radialGradient>
    <radialGradient id="glow-amber3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-voz)"/>
  <ellipse cx="400" cy="225" rx="280" ry="180" fill="url(#glow-amber3)"/>
  <ellipse cx="620" cy="110" rx="160" ry="120" fill="url(#glow-cyan2)"/>

  <g stroke="#f59e0b" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <circle cx="360" cy="215" r="120" fill="none" stroke="#f59e0b" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="360" cy="215" r="145" fill="none" stroke="#f59e0b" stroke-opacity="0.13" stroke-width="1" stroke-dasharray="8 4"/>

  <!-- Microphone -->
  <g transform="translate(360, 210)">
    <rect x="-16" y="-60" width="32" height="70" rx="16" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.6" stroke-opacity="0.85"/>
    <path d="M-30 -5 C-30 20 -18 36 0 36 C18 36 30 20 30 -5" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-opacity="0.7" stroke-linecap="round"/>
    <line x1="0" y1="36" x2="0" y2="58" stroke="#f59e0b" stroke-width="2.2" stroke-opacity="0.7"/>
    <line x1="-20" y1="58" x2="20" y2="58" stroke="#f59e0b" stroke-width="2.2" stroke-opacity="0.7" stroke-linecap="round"/>
  </g>

  <!-- Soundwave bars -->
  <g fill="#22d3ee" fill-opacity="0.8">
    <rect x="440" y="200" width="8" height="30" rx="4">
      <animate attributeName="height" values="30;60;30" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="200;185;200" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="458" y="185" width="8" height="60" rx="4">
      <animate attributeName="height" values="60;20;60" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="185;205;185" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="476" y="195" width="8" height="40" rx="4">
      <animate attributeName="height" values="40;70;40" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="195;180;195" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="494" y="205" width="8" height="20" rx="4">
      <animate attributeName="height" values="20;50;20" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="205;190;205" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Transcript panel -->
  <g transform="translate(555, 130)">
    <rect x="0" y="0" width="190" height="150" rx="10" fill="#0f0b06" fill-opacity="0.92" stroke="#f59e0b" stroke-opacity="0.22" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="9" fill="#fbbf24" font-weight="bold" letter-spacing="1">TRANSCRIPCIÓN</text>
    <text x="12" y="42" font-family="sans-serif" font-size="8" fill="#d1d5db">&quot;Recuérdame llamar a...&quot;</text>
    <text x="12" y="58" font-family="sans-serif" font-size="8" fill="#d1d5db">&quot;Reunión confirmada&quot;</text>
    <text x="12" y="74" font-family="sans-serif" font-size="8" fill="#6b7280">Precisión: 98.4%</text>
    <text x="12" y="98" font-family="monospace" font-size="8" fill="#6b7280" letter-spacing="1">ANDROID · MACOS · WIN</text>
  </g>

  <text x="400" y="345" font-family="sans-serif" font-size="26" font-weight="900" fill="white" text-anchor="middle" letter-spacing="3">APPVOZ</text>
  <text x="400" y="367" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">RECONOCIMIENTO Y SÍNTESIS DE VOZ IA</text>

  <rect x="336" y="379" width="128" height="22" rx="11" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
  <text x="400" y="393" font-family="sans-serif" font-size="9" fill="#fbbf24" text-anchor="middle" font-weight="bold" letter-spacing="2">BETA · MULTIPLATAFORMA</text>
</svg>
