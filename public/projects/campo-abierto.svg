<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-campo" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#062017"/>
      <stop offset="100%" stop-color="#070f0a"/>
    </radialGradient>
    <radialGradient id="glow-green3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-yellow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-campo)"/>
  <ellipse cx="400" cy="225" rx="280" ry="180" fill="url(#glow-green3)"/>
  <ellipse cx="620" cy="110" rx="160" ry="120" fill="url(#glow-yellow)"/>

  <g stroke="#10b981" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Sun -->
  <circle cx="400" cy="140" r="34" fill="#facc15" fill-opacity="0.18" stroke="#facc15" stroke-width="1.5" stroke-opacity="0.75"/>
  <g stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5">
    <line x1="400" y1="90" x2="400" y2="78"/>
    <line x1="440" y1="105" x2="449" y2="97"/>
    <line x1="360" y1="105" x2="351" y2="97"/>
  </g>

  <!-- Rolling field rows -->
  <g stroke="#10b981" stroke-width="2" fill="none" stroke-opacity="0.55" stroke-linecap="round">
    <path d="M40 260 Q 120 235 200 260 T 360 260 T 520 260 T 680 260 T 760 260"/>
    <path d="M40 295 Q 120 270 200 295 T 360 295 T 520 295 T 680 295 T 760 295" stroke-opacity="0.4"/>
    <path d="M40 330 Q 120 305 200 330 T 360 330 T 520 330 T 680 330 T 760 330" stroke-opacity="0.28"/>
  </g>

  <!-- Wheat stalks -->
  <g transform="translate(330, 250)">
    <line x1="0" y1="0" x2="0" y2="-70" stroke="#10b981" stroke-width="3" stroke-opacity="0.8"/>
    <g fill="#facc15" fill-opacity="0.85">
      <ellipse cx="-8" cy="-62" rx="5" ry="10" transform="rotate(-30 -8 -62)"/>
      <ellipse cx="8" cy="-62" rx="5" ry="10" transform="rotate(30 8 -62)"/>
      <ellipse cx="-8" cy="-48" rx="5" ry="10" transform="rotate(-30 -8 -48)"/>
      <ellipse cx="8" cy="-48" rx="5" ry="10" transform="rotate(30 8 -48)"/>
      <ellipse cx="0" cy="-75" rx="4.5" ry="9"/>
    </g>
  </g>
  <g transform="translate(400, 265) scale(0.8)">
    <line x1="0" y1="0" x2="0" y2="-70" stroke="#10b981" stroke-width="3" stroke-opacity="0.8"/>
    <g fill="#facc15" fill-opacity="0.85">
      <ellipse cx="-8" cy="-62" rx="5" ry="10" transform="rotate(-30 -8 -62)"/>
      <ellipse cx="8" cy="-62" rx="5" ry="10" transform="rotate(30 8 -62)"/>
      <ellipse cx="0" cy="-75" rx="4.5" ry="9"/>
    </g>
  </g>
  <g transform="translate(470, 250) scale(1.1)">
    <line x1="0" y1="0" x2="0" y2="-70" stroke="#10b981" stroke-width="3" stroke-opacity="0.8"/>
    <g fill="#facc15" fill-opacity="0.85">
      <ellipse cx="-8" cy="-62" rx="5" ry="10" transform="rotate(-30 -8 -62)"/>
      <ellipse cx="8" cy="-62" rx="5" ry="10" transform="rotate(30 8 -62)"/>
      <ellipse cx="-8" cy="-48" rx="5" ry="10" transform="rotate(-30 -8 -48)"/>
      <ellipse cx="8" cy="-48" rx="5" ry="10" transform="rotate(30 8 -48)"/>
      <ellipse cx="0" cy="-75" rx="4.5" ry="9"/>
    </g>
  </g>

  <!-- Offline / PWA badge panel -->
  <g transform="translate(555, 130)">
    <rect x="0" y="0" width="185" height="90" rx="10" fill="#070f0a" fill-opacity="0.92" stroke="#10b981" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="18" cy="18" r="5" fill="#34d399" fill-opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="22" font-family="monospace" font-size="9" fill="#34d399" font-weight="bold">MODO OFFLINE OK</text>
    <text x="12" y="45" font-family="sans-serif" font-size="8" fill="#9ca3af">Ayudas PAC detectadas: 4</text>
    <text x="12" y="60" font-family="sans-serif" font-size="8" fill="#9ca3af">Subvención autonómica: 2</text>
    <text x="12" y="75" font-family="sans-serif" font-size="8" fill="#9ca3af">Explotación: ganadera</text>
  </g>

  <text x="400" y="360" font-family="sans-serif" font-size="26" font-weight="900" fill="white" text-anchor="middle" letter-spacing="3">CAMPO ABIERTO</text>
  <text x="400" y="382" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">AYUDAS PAC PARA EL MEDIO RURAL</text>

  <rect x="330" y="394" width="140" height="22" rx="11" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
  <text x="400" y="408" font-family="sans-serif" font-size="9" fill="#34d399" text-anchor="middle" font-weight="bold" letter-spacing="2">PWA · OFFLINE-FIRST</text>
</svg>
