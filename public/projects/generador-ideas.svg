<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-idea" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#221505"/>
      <stop offset="100%" stop-color="#0f0b06"/>
    </radialGradient>
    <radialGradient id="glow-amber2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-idea)"/>
  <ellipse cx="400" cy="225" rx="280" ry="180" fill="url(#glow-amber2)"/>
  <ellipse cx="620" cy="110" rx="160" ry="120" fill="url(#glow-purple)"/>

  <g stroke="#f59e0b" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Orbit rings -->
  <circle cx="360" cy="215" r="120" fill="none" stroke="#f59e0b" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="360" cy="215" r="145" fill="none" stroke="#f59e0b" stroke-opacity="0.13" stroke-width="1" stroke-dasharray="8 4"/>

  <!-- Lightbulb icon -->
  <g transform="translate(360, 205)">
    <path d="M0 -55 C30 -55 50 -32 50 -8 C50 12 38 25 28 34 C24 38 22 43 22 49 L-22 49 C-22 43 -24 38 -28 34 C-38 25 -50 12 -50 -8 C-50 -32 -30 -55 0 -55 Z"
      fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.6" stroke-opacity="0.85"/>
    <rect x="-16" y="49" width="32" height="12" rx="3" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1"/>
    <rect x="-12" y="63" width="24" height="7" rx="2" fill="#f59e0b" fill-opacity="0.35"/>
    <path d="M-14 -10 L-2 -10 L-10 6 L4 6 L-8 30" fill="none" stroke="#fde68a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <g stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6">
      <line x1="0" y1="-80" x2="0" y2="-68"/>
      <line x1="-46" y1="-64" x2="-38" y2="-56"/>
      <line x1="46" y1="-64" x2="38" y2="-56"/>
    </g>
  </g>

  <!-- DAFO quadrant panel -->
  <g transform="translate(555, 118)">
    <rect x="0" y="0" width="185" height="160" rx="10" fill="#0f0b06" fill-opacity="0.92" stroke="#f59e0b" stroke-opacity="0.22" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="9" fill="#fbbf24" font-weight="bold" letter-spacing="1">ANÁLISIS DAFO</text>
    <g font-family="sans-serif" font-size="8" fill="#d1d5db">
      <rect x="10" y="30" width="78" height="55" rx="6" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
      <text x="18" y="44" fill="#34d399" font-weight="bold">FORTALEZAS</text>
      <rect x="97" y="30" width="78" height="55" rx="6" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1"/>
      <text x="105" y="44" fill="#f87171" font-weight="bold">DEBILIDADES</text>
      <rect x="10" y="93" width="78" height="55" rx="6" fill="#06b6d4" fill-opacity="0.08" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1"/>
      <text x="18" y="107" fill="#22d3ee" font-weight="bold">OPORTUNID.</text>
      <rect x="97" y="93" width="78" height="55" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
      <text x="105" y="107" fill="#fbbf24" font-weight="bold">AMENAZAS</text>
    </g>
  </g>

  <!-- Stat pill -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="140" height="52" rx="10" fill="#0f0b06" fill-opacity="0.9" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="8" fill="#6b7280" font-weight="bold" letter-spacing="1">PLAN SEMANAL</text>
    <text x="12" y="40" font-family="sans-serif" font-size="18" fill="#fbbf24" font-weight="bold">7 TAREAS/SEM</text>
  </g>

  <text x="400" y="340" font-family="sans-serif" font-size="26" font-weight="900" fill="white" text-anchor="middle" letter-spacing="3">AGENTE EMPRENDEDOR</text>
  <text x="400" y="362" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">MENTOR IA PARA VALIDAR IDEAS</text>

  <rect x="322" y="374" width="156" height="22" rx="11" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
  <text x="400" y="388" font-family="sans-serif" font-size="9" fill="#fbbf24" text-anchor="middle" font-weight="bold" letter-spacing="2">PRODUCCIÓN · AI-POWERED</text>
