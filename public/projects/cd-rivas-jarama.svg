<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-crj" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c1a33"/>
      <stop offset="100%" stop-color="#080b12"/>
    </radialGradient>
    <radialGradient id="glow-navy2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A3464" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1A3464" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-pink2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-crj)"/>
  <ellipse cx="400" cy="225" rx="280" ry="180" fill="url(#glow-navy2)"/>
  <ellipse cx="620" cy="110" rx="160" ry="120" fill="url(#glow-pink2)"/>

  <g stroke="#3b5a94" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <circle cx="360" cy="215" r="120" fill="none" stroke="#ec4899" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="360" cy="215" r="145" fill="none" stroke="#3b5a94" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="8 4"/>

  <!-- Club shield -->
  <g transform="translate(360, 205)">
    <path d="M0 -60 L45 -44 L45 6 C45 40 24 62 0 72 C-24 62 -45 40 -45 6 L-45 -44 Z"
      fill="#1A3464" fill-opacity="0.4" stroke="#ec4899" stroke-width="2" stroke-opacity="0.85"/>
    <path d="M0 -60 L45 -44 L45 6 C45 40 24 62 0 72 Z" fill="#ec4899" fill-opacity="0.12"/>
    <!-- Football -->
    <circle cx="0" cy="0" r="20" fill="#f2f2f2" fill-opacity="0.9" stroke="#0f172a" stroke-width="1.5"/>
    <path d="M0 -20 L6 -8 L-6 -8 Z M0 20 L6 8 L-6 8 Z M-20 0 L-8 -6 L-8 6 Z M20 0 L8 -6 L8 6 Z"
      fill="#0f172a" fill-opacity="0.7"/>
    <path d="M-6 -8 L6 -8 L8 6 L0 12 L-8 6 Z" fill="#0f172a" fill-opacity="0.75"/>
  </g>

  <!-- Club stats panel -->
  <g transform="translate(555, 130)">
    <rect x="0" y="0" width="190" height="150" rx="10" fill="#080b12" fill-opacity="0.92" stroke="#3b5a94" stroke-opacity="0.3" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="9" fill="#ec4899" font-weight="bold" letter-spacing="1">TEMPORADA 25/26</text>
    <text x="12" y="44" font-family="sans-serif" font-size="20" fill="white" font-weight="bold">200+</text>
    <text x="12" y="58" font-family="sans-serif" font-size="8" fill="#9ca3af">Jugadores federados</text>
    <text x="12" y="86" font-family="sans-serif" font-size="20" fill="white" font-weight="bold">12</text>
    <text x="12" y="100" font-family="sans-serif" font-size="8" fill="#9ca3af">Equipos en competición</text>
    <text x="12" y="128" font-family="sans-serif" font-size="8" fill="#6b7280">Rivas-Vaciamadrid · Fundado 2019</text>
  </g>

  <text x="400" y="345" font-family="sans-serif" font-size="26" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2">CD RIVAS JARAMA</text>
  <text x="400" y="367" font-family="sans-serif" font-size="11" fill="#8891a8" text-anchor="middle" letter-spacing="2">CLUB DEPORTIVO · WEB OFICIAL</text>

  <rect x="330" y="379" width="140" height="22" rx="11" fill="#ec4899" fill-opacity="0.12" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1"/>
  <text x="400" y="393" font-family="sans-serif" font-size="9" fill="#f472b6" text-anchor="middle" font-weight="bold" letter-spacing="2">PRODUCCIÓN · WEB CLUB</text>
