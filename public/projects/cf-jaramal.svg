<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-cf" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#240a0a"/>
      <stop offset="100%" stop-color="#0f0a0a"/>
    </radialGradient>
    <radialGradient id="glow-red2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-green2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-cf)"/>
  <ellipse cx="400" cy="225" rx="280" ry="180" fill="url(#glow-red2)"/>
  <ellipse cx="620" cy="110" rx="160" ry="120" fill="url(#glow-green2)"/>

  <g stroke="#ef4444" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Pitch with formation -->
  <circle cx="400" cy="215" r="120" fill="none" stroke="#ef4444" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="400" cy="215" r="145" fill="none" stroke="#ef4444" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="8 4"/>

  <rect x="335" y="140" width="130" height="150" rx="3" fill="#22c55e" fill-opacity="0.06" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="335" y1="215" x2="465" y2="215" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="400" cy="215" r="20" fill="none" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="375" y="140" width="50" height="18" fill="none" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="375" y="272" width="50" height="18" fill="none" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Player dots (formation) -->
  <circle cx="400" cy="270" r="5" fill="#ef4444"/>
  <circle cx="365" cy="240" r="5" fill="#ef4444"/>
  <circle cx="435" cy="240" r="5" fill="#ef4444"/>
  <circle cx="355" cy="190" r="5" fill="#ef4444">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="445" cy="190" r="5" fill="#ef4444"/>
  <circle cx="400" cy="165" r="5" fill="#ef4444"/>

  <!-- Ball -->
  <circle cx="400" cy="215" r="6" fill="#f9fafb" stroke="#111827" stroke-width="0.8"/>

  <!-- Convocatoria log panel -->
  <g transform="translate(560, 130)">
    <rect x="0" y="0" width="175" height="145" rx="8" fill="#0d0d1f" fill-opacity="0.9" stroke="#ef4444" stroke-opacity="0.2" stroke-width="1"/>
    <rect x="0" y="0" width="175" height="28" rx="8" fill="#ef4444" fill-opacity="0.12"/>
    <circle cx="14" cy="14" r="5" fill="#ef4444" fill-opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="25" y="18" font-family="monospace" font-size="9" fill="#f87171" font-weight="bold">CONVOCATORIA</text>

    <rect x="8" y="36" width="6" height="6" rx="1" fill="#ef4444"/>
    <text x="20" y="44" font-family="monospace" font-size="7.5" fill="#9ca3af">11 confirmados</text>

    <rect x="8" y="52" width="6" height="6" rx="1" fill="#22c55e"/>
    <text x="20" y="60" font-family="monospace" font-size="7.5" fill="#9ca3af">Alineación 1-4-3-3</text>

    <rect x="8" y="68" width="6" height="6" rx="1" fill="#ef4444"/>
    <text x="20" y="76" font-family="monospace" font-size="7.5" fill="#9ca3af">Goles registrados</text>

    <rect x="8" y="84" width="6" height="6" rx="1" fill="#fbbf24"/>
    <text x="20" y="92" font-family="monospace" font-size="7.5" fill="#9ca3af">Tarjeta amarilla</text>

    <rect x="8" y="100" width="6" height="6" rx="1" fill="#f87171"/>
    <text x="20" y="108" font-family="monospace" font-size="7.5" fill="#6b7280">Comunicado enviado</text>

    <rect x="8" y="122" width="4" height="8" fill="#ef4444" fill-opacity="0.8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="18" y="130" font-family="monospace" font-size="7" fill="#4b5563">Actualizando...</text>
  </g>

  <!-- Stat pills -->
  <g transform="translate(60, 155)">
    <rect x="0" y="0" width="130" height="52" rx="10" fill="#0d0d1f" fill-opacity="0.9" stroke="#ef4444" stroke-opacity="0.2" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="8" fill="#6b7280" font-weight="bold" letter-spacing="1">PLANTILLA</text>
    <text x="12" y="40" font-family="sans-serif" font-size="20" fill="#f87171" font-weight="bold">2016 B</text>
  </g>

  <g transform="translate(60, 220)">
    <rect x="0" y="0" width="130" height="52" rx="10" fill="#0d0d1f" fill-opacity="0.9" stroke="#22c55e" stroke-opacity="0.2" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="8" fill="#6b7280" font-weight="bold" letter-spacing="1">STATS</text>
    <text x="12" y="40" font-family="sans-serif" font-size="20" fill="#4ade80" font-weight="bold">EN VIVO</text>
  </g>

  <text x="400" y="352" font-family="sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle" letter-spacing="3">CF RIVAS 2016 B</text>
  <text x="400" y="374" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">GESTIÓN DE EQUIPO</text>

  <rect x="330" y="386" width="140" height="20" rx="10" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>
  <text x="400" y="399" font-family="sans-serif" font-size="8.5" fill="#f87171" text-anchor="middle" font-weight="bold" letter-spacing="1.5">CONVOCATORIAS · ALINEACIÓN</text>
</svg>
