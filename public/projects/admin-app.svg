<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-admin" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12122b"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <radialGradient id="glow-indigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-admin)"/>
  <ellipse cx="400" cy="225" rx="280" ry="180" fill="url(#glow-indigo)"/>
  <ellipse cx="180" cy="100" rx="160" ry="120" fill="url(#glow-violet)"/>

  <g stroke="#6366f1" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Building / property block -->
  <circle cx="400" cy="210" r="120" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="400" cy="210" r="145" fill="none" stroke="#6366f1" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="8 4"/>

  <g transform="translate(345, 130)">
    <rect x="0" y="0" width="110" height="150" rx="4" fill="#6366f1" fill-opacity="0.08" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.7"/>
    <g fill="#6366f1" fill-opacity="0.5">
      <rect x="14" y="16" width="16" height="16" rx="2"/>
      <rect x="47" y="16" width="16" height="16" rx="2"/>
      <rect x="80" y="16" width="16" height="16" rx="2"/>
      <rect x="14" y="48" width="16" height="16" rx="2"/>
      <rect x="47" y="48" width="16" height="16" rx="2" fill-opacity="0.9">
        <animate attributeName="fill-opacity" values="0.9;0.3;0.9" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="80" y="48" width="16" height="16" rx="2"/>
      <rect x="14" y="80" width="16" height="16" rx="2"/>
      <rect x="47" y="80" width="16" height="16" rx="2"/>
      <rect x="80" y="80" width="16" height="16" rx="2"/>
    </g>
    <rect x="40" y="112" width="30" height="38" rx="2" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.7"/>
    <circle cx="63" cy="131" r="1.6" fill="#6366f1"/>
  </g>

  <!-- NFC/QR chip orbit -->
  <circle cx="285" cy="170" r="5" fill="#8b5cf6" fill-opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <line x1="285" y1="170" x2="345" y2="180" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>

  <circle cx="515" cy="180" r="4" fill="#6366f1" fill-opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <line x1="515" y1="180" x2="455" y2="188" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1"/>

  <circle cx="510" cy="270" r="4" fill="#a78bfa" fill-opacity="0.8">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- VERA Copilot log panel -->
  <g transform="translate(560, 130)">
    <rect x="0" y="0" width="175" height="145" rx="8" fill="#0d0d1f" fill-opacity="0.9" stroke="#6366f1" stroke-opacity="0.2" stroke-width="1"/>
    <rect x="0" y="0" width="175" height="28" rx="8" fill="#6366f1" fill-opacity="0.12"/>
    <circle cx="14" cy="14" r="5" fill="#6366f1" fill-opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="25" y="18" font-family="monospace" font-size="9" fill="#818cf8" font-weight="bold">VERA COPILOT</text>

    <rect x="8" y="36" width="6" height="6" rx="1" fill="#6366f1"/>
    <text x="20" y="44" font-family="monospace" font-size="7.5" fill="#9ca3af">Factura procesada</text>

    <rect x="8" y="52" width="6" height="6" rx="1" fill="#8b5cf6"/>
    <text x="20" y="60" font-family="monospace" font-size="7.5" fill="#9ca3af">Auditoría OK · 04:12</text>

    <rect x="8" y="68" width="6" height="6" rx="1" fill="#f59e0b"/>
    <text x="20" y="76" font-family="monospace" font-size="7.5" fill="#9ca3af">Morosidad detectada</text>

    <rect x="8" y="84" width="6" height="6" rx="1" fill="#6366f1"/>
    <text x="20" y="92" font-family="monospace" font-size="7.5" fill="#9ca3af">QUENTIN: revisión OK</text>

    <rect x="8" y="100" width="6" height="6" rx="1" fill="#a78bfa"/>
    <text x="20" y="108" font-family="monospace" font-size="7.5" fill="#6b7280">Informe PDF generado</text>

    <rect x="8" y="122" width="4" height="8" fill="#6366f1" fill-opacity="0.8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="18" y="130" font-family="monospace" font-size="7" fill="#4b5563">Procesando...</text>
  </g>

  <!-- Stat pills -->
  <g transform="translate(60, 155)">
    <rect x="0" y="0" width="130" height="52" rx="10" fill="#0d0d1f" fill-opacity="0.9" stroke="#6366f1" stroke-opacity="0.2" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="8" fill="#6b7280" font-weight="bold" letter-spacing="1">GESTIONADO</text>
    <text x="12" y="40" font-family="sans-serif" font-size="20" fill="#818cf8" font-weight="bold">24/7</text>
  </g>

  <g transform="translate(60, 220)">
    <rect x="0" y="0" width="130" height="52" rx="10" fill="#0d0d1f" fill-opacity="0.9" stroke="#8b5cf6" stroke-opacity="0.2" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="8" fill="#6b7280" font-weight="bold" letter-spacing="1">PREDICCIÓN</text>
    <text x="12" y="40" font-family="sans-serif" font-size="20" fill="#a78bfa" font-weight="bold">QUENTIN</text>
  </g>

  <text x="400" y="340" font-family="sans-serif" font-size="24" font-weight="900" fill="white" text-anchor="middle" letter-spacing="3">ADMINAPP</text>
  <text x="400" y="362" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">PROPERTY MANAGEMENT · IA</text>

  <rect x="330" y="374" width="140" height="22" rx="11" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1"/>
  <text x="400" y="388" font-family="sans-serif" font-size="9" fill="#818cf8" text-anchor="middle" font-weight="bold" letter-spacing="2">VERA + QUENTIN AI</text>
</svg>
