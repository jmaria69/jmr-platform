<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  body { background: #09090b; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 48px; font-family: system-ui, sans-serif; color: white; padding: 40px; }
  .row { display: flex; gap: 60px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .option { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .label { font-size: 13px; color: #6b7280; letter-spacing: 0.15em; text-transform: uppercase; }
  .logo-name { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
  .card { background: #18181b; border: 1px solid #27272a; border-radius: 20px; padding: 32px 40px; display: flex; align-items: center; gap: 14px; }
</style>
</head>
<body>

<div class="row">

  <!-- OPCIÓN A: Circuito / chip -->
  <div class="option">
    <div class="label">A · Circuit Chip</div>
    <div class="card">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
        <defs>
          <linearGradient id="gA" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#c084fc"/>
            <stop offset="100%" stop-color="#22d3ee"/>
          </linearGradient>
          <filter id="gA-glow"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#a855f7" flood-opacity="0.8"/></filter>
        </defs>
        <!-- Chip body -->
        <rect x="12" y="12" width="20" height="20" rx="3" stroke="url(#gA)" stroke-width="1.8" fill="none" filter="url(#gA-glow)"/>
        <!-- Pins left -->
        <line x1="4" y1="17" x2="12" y2="17" stroke="url(#gA)" stroke-width="1.5"/>
        <line x1="4" y1="22" x2="12" y2="22" stroke="url(#gA)" stroke-width="1.5"/>
        <line x1="4" y1="27" x2="12" y2="27" stroke="url(#gA)" stroke-width="1.5"/>
        <!-- Pins right -->
        <line x1="32" y1="17" x2="40" y2="17" stroke="url(#gA)" stroke-width="1.5"/>
        <line x1="32" y1="22" x2="40" y2="22" stroke="url(#gA)" stroke-width="1.5"/>
        <line x1="32" y1="27" x2="40" y2="27" stroke="url(#gA)" stroke-width="1.5"/>
        <!-- Pins top -->
        <line x1="17" y1="4" x2="17" y2="12" stroke="url(#gA)" stroke-width="1.5"/>
        <line x1="27" y1="4" x2="27" y2="12" stroke="url(#gA)" stroke-width="1.5"/>
        <!-- Pins bottom -->
        <line x1="17" y1="32" x2="17" y2="40" stroke="url(#gA)" stroke-width="1.5"/>
        <line x1="27" y1="32" x2="27" y2="40" stroke="url(#gA)" stroke-width="1.5"/>
        <!-- Inner: stylized "A" -->
        <path d="M22 16 L26 28 M22 16 L18 28 M19.5 24 L24.5 24" stroke="url(#gA)" stroke-width="2" stroke-linecap="round" fill="none"/>
        <!-- Pin dots -->
        <circle cx="4" cy="17" r="1.5" fill="#c084fc"/>
        <circle cx="4" cy="22" r="1.5" fill="#a78bfa"/>
        <circle cx="4" cy="27" r="1.5" fill="#22d3ee"/>
        <circle cx="40" cy="17" r="1.5" fill="#c084fc"/>
        <circle cx="40" cy="22" r="1.5" fill="#a78bfa"/>
        <circle cx="40" cy="27" r="1.5" fill="#22d3ee"/>
        <circle cx="17" cy="4" r="1.5" fill="#c084fc"/>
        <circle cx="27" cy="4" r="1.5" fill="#22d3ee"/>
        <circle cx="17" cy="40" r="1.5" fill="#a78bfa"/>
        <circle cx="27" cy="40" r="1.5" fill="#22d3ee"/>
      </svg>
      <div>
        <div class="logo-name" style="background: linear-gradient(135deg,#c084fc,#22d3ee); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Agentic<span style="-webkit-text-fill-color:#22d3ee">Lab</span></div>
        <div style="font-size:9px;color:#4b5563;letter-spacing:0.2em;text-transform:uppercase;margin-top:2px;">AI Agents Studio</div>
      </div>
    </div>
  </div>

  <!-- OPCIÓN B: Flask / laboratorio -->
  <div class="option">
    <div class="label">B · Lab Flask</div>
    <div class="card">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
        <defs>
          <linearGradient id="gB" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#818cf8"/>
            <stop offset="100%" stop-color="#34d399"/>
          </linearGradient>
          <filter id="gB-glow"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.7"/></filter>
        </defs>
        <!-- Flask body -->
        <path d="M16 6 L16 20 L8 36 Q7 38 9 38 L35 38 Q37 38 36 36 L28 20 L28 6" stroke="url(#gB)" stroke-width="2" fill="none" stroke-linejoin="round" filter="url(#gB-glow)"/>
        <!-- Flask mouth -->
        <line x1="13" y1="6" x2="31" y2="6" stroke="url(#gB)" stroke-width="2" stroke-linecap="round"/>
        <!-- Liquid fill -->
        <path d="M10.5 33 Q14 28 22 30 Q30 32 33.5 33 L35 38 Q37 38 36 36 L28 20 L16 20 L8 36 Q7 38 9 38 Z" fill="url(#gB)" opacity="0.18"/>
        <!-- Bubbles (AI nodes) -->
        <circle cx="18" cy="31" r="2.5" fill="url(#gB)" opacity="0.7" filter="url(#gB-glow)"/>
        <circle cx="25" cy="33" r="1.8" fill="#34d399" opacity="0.8"/>
        <circle cx="22" cy="27" r="1.5" fill="#818cf8" opacity="0.6"/>
        <!-- Lab cross top -->
        <line x1="22" y1="2" x2="22" y2="5" stroke="url(#gB)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="logo-name" style="background: linear-gradient(135deg,#818cf8,#34d399); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Agentic<span style="-webkit-text-fill-color:#34d399">Lab</span></div>
        <div style="font-size:9px;color:#4b5563;letter-spacing:0.2em;text-transform:uppercase;margin-top:2px;">AI Agents Studio</div>
      </div>
    </div>
  </div>

  <!-- OPCIÓN C: Neural orbit / atom rings -->
  <div class="option">
    <div class="label">C · Neural Orbit</div>
    <div class="card">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
        <defs>
          <linearGradient id="gC" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#f472b6"/>
            <stop offset="50%" stop-color="#a78bfa"/>
            <stop offset="100%" stop-color="#38bdf8"/>
          </linearGradient>
          <filter id="gC-glow"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#a78bfa" flood-opacity="0.8"/></filter>
        </defs>
        <!-- Orbit ring 1 (tilted) -->
        <ellipse cx="22" cy="22" rx="18" ry="7" stroke="url(#gC)" stroke-width="1.5" fill="none" opacity="0.5"/>
        <!-- Orbit ring 2 (tilted 60°) -->
        <ellipse cx="22" cy="22" rx="18" ry="7" stroke="url(#gC)" stroke-width="1.5" fill="none" opacity="0.5" transform="rotate(60 22 22)"/>
        <!-- Orbit ring 3 (tilted 120°) -->
        <ellipse cx="22" cy="22" rx="18" ry="7" stroke="url(#gC)" stroke-width="1.5" fill="none" opacity="0.5" transform="rotate(120 22 22)"/>
        <!-- Core nucleus -->
        <circle cx="22" cy="22" r="4.5" fill="url(#gC)" filter="url(#gC-glow)"/>
        <!-- Electron dots -->
        <circle cx="40" cy="22" r="2.5" fill="#38bdf8" filter="url(#gC-glow)"/>
        <circle cx="13" cy="7"  r="2.5" fill="#f472b6" filter="url(#gC-glow)"/>
        <circle cx="13" cy="37" r="2.5" fill="#a78bfa" filter="url(#gC-glow)"/>
      </svg>
      <div>
        <div class="logo-name" style="background: linear-gradient(135deg,#f472b6,#a78bfa,#38bdf8); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Agentic<span style="-webkit-text-fill-color:#38bdf8">Lab</span></div>
        <div style="font-size:9px;color:#4b5563;letter-spacing:0.2em;text-transform:uppercase;margin-top:2px;">AI Agents Studio</div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
